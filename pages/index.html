<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校園充電站系統</title>
  <style>
    :root {
      --bg: #EFE9E1; --card: #FAF7F2; --text: #2B2622; --muted: #6E655C;
      --accent: #AD6442; --border: #DDD3C6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1C1F2B; --card: #262A39; --text: #E8E4DE; --muted: #8E9BA5;
        --accent: #C49B76; --border: #353A4D;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text);
      font-family: system-ui, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    main { width: 100%; max-width: 640px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p.sub { margin: 0 0 24px; color: var(--muted); }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    a.card {
      display: block; padding: 20px; border-radius: 16px; text-decoration: none; color: inherit;
      background: var(--card); border: 1px solid var(--border);
      transition: transform .12s ease, border-color .12s ease;
    }
    a.card:hover, a.card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
    .tag { font-size: .75rem; color: var(--accent); font-weight: 600; letter-spacing: .04em; }
    h2 { font-size: 1.15rem; margin: 6px 0 6px; }
    .desc { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.5; }
    footer { margin-top: 24px; font-size: .8rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>校園充電站系統</h1>
    <p class="sub">互動原型（模擬資料，無後端）</p>
    <div class="grid">
      <a class="card" href="./user/">
        <span class="tag">STUDENT · 手機版</span>
        <h2>學生端</h2>
        <p class="desc">充電狀態、違規記點、掃碼充電與充電紀錄。</p>
      </a>
      <a class="card" href="./manager/">
        <span class="tag">SECURITY · 桌面版</span>
        <h2>駐警隊管理端</h2>
        <p class="desc">充電站總覽、使用紀錄、記點與停權管理、異常回報。</p>
      </a>
    </div>
    <footer>學生端建議以手機或縮小視窗瀏覽；管理端建議使用桌面瀏覽器。</footer>
  </main>
</body>
</html>
